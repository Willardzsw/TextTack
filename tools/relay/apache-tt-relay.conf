# Apache site for tt-relay. Replace tt.example.com with the real subdomain before installing.
# certbot --apache adds the HTTPS copy (tt-relay-le-ssl.conf) and the redirect.
<VirtualHost *:80>
    ServerName tt.example.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 150
    ProxyPass        / http://127.0.0.1:8230/ timeout=150
    ProxyPassReverse / http://127.0.0.1:8230/

    # Bodies are text only; the relay itself refuses anything over 1 MB.
    LimitRequestBody 1048576

    # No access log: requests carry nothing worth keeping and the relay logs its own one line.
    CustomLog /dev/null common
    ErrorLog ${APACHE_LOG_DIR}/tt-relay-error.log
</VirtualHost>
